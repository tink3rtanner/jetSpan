<!DOCTYPE html>
<html>
<head><title>Benchmark Runner</title></head>
<body>
<pre id="output">Loading JetSpan in an isolated frame...</pre>
<button id="download" hidden>Download benchmark JSON</button>
<iframe id="iso-frame" src="isochrone.html" style="width:1920px;height:1080px;border:none;"></iframe>
<script>
const output = document.getElementById('output');
const download = document.getElementById('download');
function log(msg) { output.textContent += '\n' + msg; }

const iframe = document.getElementById('iso-frame');
iframe.onload = async function() {
    const doc = iframe.contentDocument;
    const win = iframe.contentWindow;
    try {
        log('Frame loaded; installing journey benchmark...');
        const script = doc.createElement('script');
        script.src = 'scripts/interaction-bench.js';
        await new Promise((resolve, reject) => {
            script.onload = resolve;
            script.onerror = () => reject(new Error('benchmark script failed to load'));
            doc.head.appendChild(script);
        });

        const readiness = await win.waitForJetSpanReady();
        if (!readiness.ready) throw new Error('JetSpan did not become ready within 120s');
        log(`Ready: ${readiness.cells} cells at resolution ${readiness.resolution}`);
        log('Running interaction journey...');

        const results = await win.runInteractionBench();
        if (!results) throw new Error('benchmark returned no results');
        const scenarioNames = new Set(results.results.map(result => result.scenario));
        for (const required of [
            'zoom-thresholds',
            'pan-load-matrix',
            'chunk-cache',
            'ui-transitions',
            'rapid-navigation-race',
            'antimeridian-navigation',
            'pin-interaction',
        ]) {
            if (!scenarioNames.has(required)) {
                throw new Error(`missing required scenario: ${required}`);
            }
        }
        const zoomThresholds = results.results.find(result => result.scenario === 'zoom-thresholds');
        if (zoomThresholds.transitionFailures !== 0) {
            throw new Error(`${zoomThresholds.transitionFailures} zoom transitions rendered the wrong resolution`);
        }
        const panMatrix = results.results.find(result => result.scenario === 'pan-load-matrix');
        if (!panMatrix.stops || panMatrix.stops.length < 14) {
            throw new Error('pan/load matrix did not cover all representative stops');
        }
        const chunkCache = results.results.find(result => result.scenario === 'chunk-cache');
        if (chunkCache.cacheFailures !== 0) {
            throw new Error(`${chunkCache.cacheFailures} warm chunk revisits fetched data again`);
        }
        const uiTransitions = results.results.find(result => result.scenario === 'ui-transitions');
        if (!uiTransitions.steps || uiTransitions.steps.length < 17) {
            throw new Error('UI transition matrix is incomplete');
        }
        if (uiTransitions.hoverFailures !== 0) {
            throw new Error('hover transition did not produce a tooltip');
        }
        if (uiTransitions.restoreFailures !== 0) {
            throw new Error('benchmark did not restore UI toggle state');
        }
        if (uiTransitions.panelFailures !== 0) {
            throw new Error('info panel open/close transition failed');
        }
        const rapidNavigation = results.results.find(result => result.scenario === 'rapid-navigation-race');
        if (rapidNavigation.navigationFailures !== 0) {
            throw new Error('rapid navigation left the map at a stale viewport or resolution');
        }
        const antimeridian = results.results.find(result => result.scenario === 'antimeridian-navigation');
        if (antimeridian.renderFailures !== 0) {
            throw new Error(`${antimeridian.renderFailures} antimeridian viewports rendered no cells`);
        }
        const pinInteraction = results.results.find(result => result.scenario === 'pin-interaction');
        if (!pinInteraction.skipped && pinInteraction.pinFailures !== 0) {
            throw new Error(`${pinInteraction.pinFailures} multi-pin transitions failed`);
        }
        if (!results.startup || !Number.isFinite(results.startup.readyMs)) {
            throw new Error('startup timing is missing');
        }
        if (results.layout?.horizontalOverflowPx > 1) {
            throw new Error(`page overflows viewport by ${results.layout.horizontalOverflowPx}px`);
        }
        const json = JSON.stringify(results, null, 2);
        download.hidden = false;
        download.onclick = () => {
            const blob = new Blob([json + '\n'], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `jetspan-benchmark-${new Date().toISOString().slice(0, 10)}.json`;
            link.click();
            setTimeout(() => URL.revokeObjectURL(link.href), 0);
        };
        log('\n' + json);
        log('\nBENCHMARK_PASS');
    } catch (error) {
        log('\nBENCHMARK_FAIL: ' + error.message);
    } finally {
        log('BENCHMARK_COMPLETE');
    }
};
</script>
</body>
</html>
