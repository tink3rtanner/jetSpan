<script>
// synchronous one-time SVG generation: 7 wobbled isolines, opaque premixed band
// fills (painter's algorithm outermost-first), ring tick marks, a labelled SE
// dimension ray, and the key table. no timers, no fetch, no animation.
(function(){
  var NS='http://www.w3.org/2000/svg';
  var OX=255, OY=335, STX=1.18;                 // origin datum + eastward stretch
  var BASES=[60,135,190,265,345,445,480];       // ring base radii (band outer edges)
  var TIMES=['3H','6H','10H','15H','22H','32H'];// boundary times for rings 1..6
  // relaxed monotonic ramp: green -> yellow-green -> yellow -> amber -> orange -> red -> deep red
  var COLS=['#4fd484','#a5d95d','#dede4a','#eec53f','#ee8c3c','#d84040','#8c2226'];
  var BG=[11,20,32];                            // #0b1420 ground for premixing

  function el(t,at,parent){var e=document.createElementNS(NS,t);for(var k in at)e.setAttribute(k,at[k]);if(parent)parent.appendChild(e);return e;}
  // smooth deterministic wobble shared across rings (keeps them nested)
  function wob(th){return 0.5*Math.sin(3*th+1.2)+0.35*Math.sin(5*th-0.7)+0.15*Math.sin(7*th+2.1);}
  function radius(k,th){return BASES[k]*(1+0.06*wob(th)+0.02*Math.sin((5+k)*th+1.7*k));}
  function pt(k,th){var r=radius(k,th);return [OX+r*STX*Math.cos(th), OY+r*Math.sin(th)];}
  function mix(hex,a){ // premix band color over ground -> opaque fill (no alpha stacking)
    var c=[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];
    var m=c.map(function(v,i){return Math.round(BG[i]+(v-BG[i])*a);});
    return 'rgb('+m[0]+','+m[1]+','+m[2]+')';
  }
  function ringPath(k){
    var N=160,d='';
    for(var i=0;i<=N;i++){var th=i/N*2*Math.PI;var p=pt(k,th);d+=(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1);}
    return d+'Z';
  }

  var bands=document.getElementById('bands');
  var iso=document.getElementById('isolines');

  // terminal 32H+ field underlays the whole panel; ring 7 is its dashed survey limit
  el('rect',{x:40,y:40,width:670,height:612,fill:mix(COLS[6],0.30)},bands);
  // opaque fills, outermost first (band k+1 sits between ring k and k+1)
  for(var k=5;k>=0;k--) el('path',{d:ringPath(k),fill:mix(COLS[k],0.34)},bands);

  // luminous isolines + radial tick marks
  for(k=0;k<7;k++){
    var at={d:ringPath(k),fill:'none',stroke:COLS[k],'stroke-width':k===6?1.1:1.4};
    if(k===6){at['stroke-dasharray']='7 4';at.opacity=0.9;}
    el('path',at,iso);
    if(k===6) continue;                          // no ticks on the dashed survey limit
    for(var i=0;i<40;i++){                       // small outward ticks, drafted cadence
      var th=i/40*2*Math.PI, p=pt(k,th);
      var dx=STX*Math.cos(th), dy=Math.sin(th), L=Math.hypot(dx,dy); dx/=L; dy/=L;
      el('line',{x1:p[0],y1:p[1],x2:p[0]+dx*4.5,y2:p[1]+dy*4.5,stroke:COLS[k],'stroke-width':0.8,opacity:0.85},iso);
    }
  }

  // ============ dimension ray SE of datum: arrow + per-ring time callouts ============
  var ray=document.getElementById('ray'), thr=0.75;
  var ex=OX+520*STX*Math.cos(thr), ey=OY+520*Math.sin(thr);
  el('line',{x1:OX,y1:OY,x2:ex,y2:ey,stroke:'#cfe3f2','stroke-width':0.7,'stroke-dasharray':'10 3 2 3',opacity:0.9},ray);
  var ux=STX*Math.cos(thr), uy=Math.sin(thr), UL=Math.hypot(ux,uy); ux/=UL; uy/=UL;
  // arrowhead at panel-edge end
  el('path',{d:'M'+ex+','+ey+' l'+(-8*ux+3*uy)+','+(-8*uy-3*ux)+' M'+ex+','+ey+' l'+(-8*ux-3*uy)+','+(-8*uy+3*ux),stroke:'#cfe3f2','stroke-width':0.9,fill:'none'},ray);
  for(k=0;k<6;k++){
    var p=pt(k,thr);
    el('line',{x1:p[0]-4*uy,y1:p[1]+4*ux,x2:p[0]+4*uy,y2:p[1]-4*ux,stroke:'#f2f8fd','stroke-width':1.2},ray); // perpendicular dimension tick
    var w=TIMES[k].length*6.4+8;
    el('rect',{x:p[0]+7,y:p[1]-14,width:w,height:12,fill:'#0b1420',stroke:COLS[k],'stroke-width':0.7,opacity:0.95},ray);
    var t=el('text',{x:p[0]+11,y:p[1]-4.8,'font-size':8.5,fill:COLS[k],'letter-spacing':'0.5',class:'mono'},ray);
    t.textContent=TIMES[k];
  }
  var rl=el('text',{x:OX+34*ux+10,y:OY+34*uy+16,'font-size':6.5,fill:'#8fb0c9','letter-spacing':'0.8',class:'mono',transform:'rotate(38 '+(OX+34*ux+10)+' '+(OY+34*uy+16)+')'},ray);
  rl.textContent='PASSAGE-TIME DIMENSION RAY';

  // ============ key table (swatches premixed exactly as on the map) ============
  var keyG=document.getElementById('keytable');
  var KX=722, KY=40, KW=240, RH=22, LAB=['<3H','3–6H','6–10H','10–15H','15–22H','22–32H','32H+'];
  el('rect',{x:KX,y:KY,width:KW,height:26+7*RH+16,fill:'#0d1826',stroke:'#8fb8d8','stroke-width':0.9},keyG);
  var hd=el('text',{x:KX+10,y:KY+17,'font-size':9.5,fill:'#eaf4fc','letter-spacing':'2',class:'mono'},keyG);
  hd.textContent='KEY — PASSAGE TIME';
  el('path',{d:'M'+KX+' '+(KY+26)+'h'+KW,stroke:'#8fb8d8','stroke-width':0.6},keyG);
  for(k=0;k<7;k++){
    var ry=KY+26+k*RH;
    el('path',{d:'M'+KX+' '+(ry+RH)+'h'+KW,stroke:'#8fb8d8','stroke-width':0.35,opacity:0.6},keyG);
    el('rect',{x:KX+12,y:ry+6,width:34,height:10,fill:mix(COLS[k],0.34),stroke:COLS[k],'stroke-width':1},keyG);
    if(k===6) el('rect',{x:KX+12,y:ry+6,width:34,height:10,fill:'url(#hatch7)'},keyG); // texture relief on terminal band
    var bn=el('text',{x:KX+56,y:ry+15,'font-size':8,fill:'#6d8fab',class:'mono','letter-spacing':'0.5'},keyG);
    bn.textContent='BAND 0'+(k+1);
    var tv=el('text',{x:KX+KW-12,y:ry+15,'font-size':9,fill:'#e6f1fa','text-anchor':'end',class:'mono','letter-spacing':'0.8'},keyG);
    tv.textContent=LAB[k];
  }
  var ft=el('text',{x:KX+10,y:KY+26+7*RH+11,'font-size':6.3,fill:'#6d8fab','letter-spacing':'0.5',class:'mono'},keyG);
  ft.textContent='RAMP MONOTONIC GRN→YEL→ORG→RED. NO MID-RAMP REVERSAL.';
})();
</script>
