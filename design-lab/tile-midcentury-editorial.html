<title>How far can you get from Bristol?</title>
<style>
  /* ============================================================
     isochrone passage chart — editorial data-graphics tile
     design language: NYT/FT/Economist house style.
     fixed 1000x750 artboard, fully self-contained, no network.
     ============================================================ */
  html, body { margin:0; padding:0; background:#e4e4e0; }
  #tile {
    position:relative; width:1000px; height:750px;
    background:#fdfdfb;                       /* warm paper white */
    overflow:hidden; box-sizing:border-box;
    font-family: Arial, Helvetica, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  /* thin accent rule across the top — single accent (band-1 green) */
  #tile .toprule { position:absolute; top:0; left:0; width:1000px; height:3px; background:#1a7f47; }

  /* ---- header block: kicker / hed / dek (serif hed, sans everything else) ---- */
  .kicker {
    position:absolute; top:32px; left:52px;
    font-size:11px; font-weight:bold; letter-spacing:2px; color:#1a7f47;
  }
  .hed {
    position:absolute; top:50px; left:52px; width:580px;
    font-family: Georgia, 'Times New Roman', serif;
    font-size:31px; font-weight:bold; line-height:1.12; color:#141414;
  }
  .dek {
    position:absolute; top:96px; left:52px; width:560px;
    font-size:14.5px; color:#575757; line-height:1.35;
  }

  /* ---- legend: discrete swatch ramp, top-right, quiet ---- */
  .legend { position:absolute; top:42px; right:52px; width:294px; }
  .legend .lt {
    font-size:10px; font-weight:bold; letter-spacing:1.2px; color:#6b6b6b;
    margin-bottom:7px; text-align:left;
  }
  .legend .row { display:flex; }
  .legend .cell { width:42px; }
  .legend .sw { height:11px; border-right:1px solid #fdfdfb; }   /* white gap echoes isolines */
  .legend .cell:last-child .sw { border-right:none; }
  .legend .tl { font-size:9.5px; color:#6b6b6b; text-align:center; padding-top:4px; }

  /* ---- map svg ---- */
  #map { position:absolute; top:152px; left:0; }

  /* ---- svg text classes ---- */
  text { font-family: Arial, Helvetica, system-ui, sans-serif; }
  .lbl  {  /* city label, white knockout halo for legibility over busy bands */
    font-size:12.5px; font-weight:bold; fill:#1d1d1b;
    paint-order:stroke; stroke:#ffffff; stroke-width:3px; stroke-linejoin:round;
  }
  .lblD {  /* dark-background variant (far bands): white ink, deep halo */
    font-size:12.5px; font-weight:bold; fill:#ffffff;
    paint-order:stroke; stroke:#4a0b06; stroke-width:3px; stroke-linejoin:round;
  }
  .origin-tag {
    font-size:8.5px; font-weight:bold; letter-spacing:1.4px; fill:#5b6b70;
    paint-order:stroke; stroke:#ffffff; stroke-width:2.5px; stroke-linejoin:round;
  }
  .sea-name {
    font-family: Georgia, serif; font-style:italic;
    font-size:10.5px; letter-spacing:2.4px; fill:#9db0b5;
  }
  .iso {   /* small hour labels sitting on the isolines over open sea */
    font-family: Georgia, serif; font-style:italic; font-size:10px; fill:#5f7076;
    paint-order:stroke; stroke:#e9f0f1; stroke-width:4px; stroke-linejoin:round;
  }
  .anno {  /* editorial annotation, serif italic, haloed */
    font-family: Georgia, serif; font-style:italic; font-size:12.5px; fill:#3f4a4e;
    paint-order:stroke; stroke:#e9f0f1; stroke-width:3.5px; stroke-linejoin:round;
  }
  .annoD { /* annotation over the dark far bands */
    font-family: Georgia, serif; font-style:italic; font-size:12.5px; fill:#ffffff;
    paint-order:stroke; stroke:#4a0b06; stroke-width:3px; stroke-linejoin:round;
  }

  /* ---- footer / source line ---- */
  .source {
    position:absolute; left:52px; right:52px; bottom:24px;
    border-top:1px solid #dcdcd6; padding-top:8px;
    font-size:10.5px; color:#8a8a84;
  }
</style>

    <!-- 1. quiet sea -->

    <!-- 3. land, filled with the time bands (script paints back-to-front, clipped) -->
    <g clip-path="url(#landClip)">
      <rect x="0" y="0" width="1000" height="520" fill="#f7f5f0"/>  <!-- land base -->
      <g id="band-fills" fill-opacity="0.92"></g>
      <g id="band-lines" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.9"></g>
    </g>

    <!-- 4. crisp white coastline separates coloured land from pale sea -->
    <g fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linejoin="round">

      <use href="#pCO"/><use href="#pSA"/><use href="#pSI"/><use href="#pBA"/>
    </g>

    <!-- 5. sea names, whisper-quiet -->

    <!-- 6. hour labels riding the isolines over the atlantic (filled by script) -->

  <div class="source">
    Times are shortest scheduled journeys by rail, sea and road; band boundaries are indicative.
    &nbsp;Source: JetSpan journey-time model, 2026&ensp;&middot;&ensp;Graphic: JetSpan Design Lab
  </div>
</div>

<script>
/* one-time synchronous SVG generation: the seven time bands as gently-irregular
   nested blobs around the origin. no timers, no animation, no fetch. */
(function () {
  var CX = 270, CY = 235;          // bristol, map coords
  var K  = 0.8;                    // vertical squash: bands are soft ellipses, not circles

  // outer radius of bands 1..6 (band 7 = everything beyond r6)
  var RINGS = [115, 225, 320, 420, 505, 590];

  // monotonic sequential ramp, colorbrewer RdYlGn-derived, reversed:
  // green -> light green -> yellow-green -> yellow -> orange -> red -> deep red.
  // no hue reversals, nothing blue/purple. continent reads mostly green->yellow.
  var COLS  = ['#1a9850', '#66bd63', '#a6d96a', '#fee08b', '#fdae61', '#d73027'];
  var FAR   = '#5f0c06';           // 32h+: deep red, near-black
  var TIMES = ['<3', '3–6', '6–10', '10–15', '15–22', '22–32', '32+'];

  // deterministic organic perturbation. shared harmonics keep the rings nested
  // (R is strictly increasing in r for every angle); the (r/530) term lets the
  // outer rings wander a little more than the inner ones.
  function noise(t, r) {
    return 0.035 * Math.sin(3 * t + 0.7)
         + 0.020 * Math.sin(5 * t + 2.3)
         + 0.025 * Math.sin(2 * t + 4.2)
         + (r / 530) * 0.02 * Math.sin(4 * t + 1.6);
  }
  function pt(t, r) {
    var R = r * (1 + noise(t, r));
    return [CX + R * Math.cos(t), CY + K * R * Math.sin(t)];
  }
  function blobPath(r) {
    var d = '';
    for (var i = 0; i <= 144; i++) {
      var p = pt(i / 144 * 2 * Math.PI, r);
      d += (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1);
    }
    return d + 'Z';
  }

  // band fills, painted back-to-front so each disc reveals only its own band
  var fills = '<rect x="0" y="0" width="1000" height="520" fill="' + FAR + '"/>';
  for (var i = RINGS.length - 1; i >= 0; i--) {
    fills += '<path d="' + blobPath(RINGS[i]) + '" fill="' + COLS[i] + '"/>';
  }
  document.getElementById('band-fills').innerHTML = fills;

  // thin white isolines between bands (on land) + faint dashed ghosts (over sea)
  var lines = '';
  for (var j = 0; j < RINGS.length; j++) lines += '<path d="' + blobPath(RINGS[j]) + '"/>';
  document.getElementById('band-lines').innerHTML = lines;
  document.getElementById('sea-rings').innerHTML  = lines;

  // small hour labels where the inner isolines cross open atlantic (sw of origin)
  var isoTags = [[115, '3 hrs', 2.42], [225, '6 hrs', 2.42], [320, '10 hrs', 2.1]];
  var isoHtml = '';
  for (var k = 0; k < isoTags.length; k++) {
    var q = pt(isoTags[k][2], isoTags[k][0]);
    isoHtml += '<text class="iso" x="' + q[0].toFixed(1) + '" y="' + (q[1] + 3.5).toFixed(1) +
               '" text-anchor="middle">' + isoTags[k][1] + '</text>';
  }
  document.getElementById('iso-labels').innerHTML = isoHtml;

  // legend cells from the same ramp (single source of truth for colour)
  var all = COLS.concat([FAR]), sw = '', tl = '';
  for (var m = 0; m < 7; m++) {
    sw += '<div class="cell"><div class="sw" style="background:' + all[m] + '"></div></div>';
    tl += '<div class="cell"><div class="tl">' + TIMES[m] + '</div></div>';
  }
  document.getElementById('legend-sw').innerHTML = sw;
  document.getElementById('legend-tl').innerHTML = tl;
})();
</script>
